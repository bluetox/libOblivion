[package]
name = "lib_oblivion"
version = "0.1.0"
edition = "2024"

[lib]
name = "Oblivion"
crate-type = ["cdylib"]


[dependencies]
rustls = { version = "0.23.27", features = ["std"] }
argh = "0.1.1"
futures-util = "0.3.1"
lazy_static = "1.1"
rcgen = { version = "0.14", features = ["pem"] }
tokio = { version = "1.0", features = ["full"] }
webpki-roots = "1"
tokio-rustls = "0.26.3"
jni = "0.21.1"
log = "0.4"
android_logger = "0.11"
bincode = "1.3.3"
pq_tls = { version = "0.1.0", path = "pq_tls" }
sqlx = { version = "0.8.3", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid"] }
ed25519-dalek = "2.1.1"
rand = "0.8.5"
pure_dsa = { version = "0.1.0", path = "pure_dsa" }
blake3 = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21" 
kyber = { version = "0.1.0", path = "kyber" }
zeroizing-alloc = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }